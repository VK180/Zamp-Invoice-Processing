services:
  - type: web
    name: zamp-invoice-processing
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://amruth-t-0567-resource.openai.azure.com/openai/v1
      - key: LLM_MODEL
        value: gpt-4o
      - key: AP_TOLERANCE_PERCENTAGE
        value: "2.0"
      - key: OPENAI_API_KEY
        sync: false
